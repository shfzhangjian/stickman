<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="纯 Canvas 2D 绘制的火柴人游戏精灵动作预览器。">
  <title>火柴人动作预览器</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='14' r='9' fill='none' stroke='%23111111' stroke-width='6'/%3E%3Cpath d='M32 23v19M17 31l15 7 15-7M32 42 20 58M32 42l12 16' fill='none' stroke='%23111111' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #16191d;
      --muted: #67707a;
      --line: #d5dbe1;
      --panel: #ffffff;
      --page: #e9eef2;
      --accent: #ec5b45;
      --accent-dark: #bd3828;
      --blue: #2d6f95;
      --green: #49795e;
      --focus: #236fa1;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #dce7ed 0, #eef2f4 280px, var(--page) 100%);
      color: var(--ink);
    }

    button, select, input { font: inherit; }

    button, select {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
    }

    button {
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, color 140ms ease, transform 140ms ease;
    }

    button:hover { border-color: #9ca6af; background: #f5f7f8; }
    button:active { transform: translateY(1px); }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus), transparent 70%);
      outline-offset: 2px;
    }

    .app-shell {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.5vw, 2rem);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #43a36f;
      box-shadow: 0 0 0 4px rgba(67, 163, 111, 0.15);
    }

    .workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(130, 145, 156, 0.32);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(29, 41, 50, 0.08);
    }

    .action-panel {
      padding: 14px;
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
    }

    .panel-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.77rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mobile-action-select { display: none; width: 100%; padding: 0 11px; }

    .action-list {
      display: grid;
      gap: 6px;
    }

    .action-button {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      text-align: left;
      font-weight: 650;
    }

    .action-button .index {
      color: #8a939b;
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .action-button .en {
      color: #87919a;
      font-size: 0.73rem;
      font-weight: 650;
    }

    .action-button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    .action-button.active .index,
    .action-button.active .en { color: #bbc2c8; }

    .stage-column { min-width: 0; }

    .stage-panel {
      position: relative;
      overflow: hidden;
      background: #cfe1e9;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      touch-action: manipulation;
    }

    .stage-hud {
      position: absolute;
      inset: 14px 14px auto;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .hud-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 4px 14px rgba(38, 58, 67, 0.08);
      color: #273039;
      font-size: 0.83rem;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .hud-chip strong { color: var(--accent-dark); }

    .controls-panel {
      display: grid;
      grid-template-columns: auto minmax(150px, 0.9fr) minmax(150px, 0.75fr) minmax(140px, 0.65fr) auto auto;
      gap: 12px;
      align-items: end;
      margin-top: 14px;
      padding: 14px;
    }

    .control-group {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .control-group > label,
    .control-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .primary-button {
      min-width: 94px;
      padding: 0 16px;
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
      font-weight: 750;
    }

    .primary-button:hover { border-color: #2e3338; background: #2e3338; }

    select { width: 100%; padding: 0 34px 0 11px; }

    .range-row {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 58px;
      align-items: center;
      gap: 10px;
      min-height: 42px;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .speed-value {
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .switch-row {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
      font-weight: 650;
    }

    .switch-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .secondary-button { padding: 0 14px; font-weight: 700; white-space: nowrap; }

    .timeline {
      grid-column: 1 / -1;
      height: 4px;
      overflow: hidden;
      border-radius: 2px;
      background: #e1e5e8;
    }

    .timeline-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ef9f3c);
      transform-origin: left;
    }

    .footer-note {
      margin: 12px 2px 0;
      color: #727b83;
      font-size: 0.78rem;
      text-align: right;
    }

    @media (max-width: 980px) {
      .workspace { grid-template-columns: 1fr; }
      .action-panel { position: static; }
      .action-list { display: none; }
      .mobile-action-select { display: block; }
      .controls-panel { grid-template-columns: auto minmax(160px, 1fr) minmax(145px, 0.75fr); }
      .switch-group, .reset-group { align-self: end; }
    }

    @media (max-width: 680px) {
      .app-shell { padding: 12px; }
      .topbar { align-items: start; }
      .brand p { font-size: 0.84rem; }
      .live-status { display: none; }
      .stage-hud { inset: 9px 9px auto; }
      .hud-chip { min-height: 28px; padding: 4px 7px; font-size: 0.72rem; }
      .controls-panel { grid-template-columns: 1fr 1fr; }
      .play-group { grid-column: 1 / -1; }
      .primary-button { width: 100%; }
      .target-group, .speed-group, .box-count-group { grid-column: 1 / -1; }
      .footer-note { text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>火柴人动作预览器</h1>
        <p>Canvas 2D · 关键姿势分镜与场景反馈</p>
      </div>
      <div class="live-status" aria-hidden="true"><span class="live-dot"></span>实时渲染</div>
    </header>

    <section class="workspace" aria-label="动作预览工作区">
      <aside class="panel action-panel">
        <h2 class="panel-title">动作库</h2>
        <select id="mobileActionSelect" class="mobile-action-select" aria-label="选择动作"></select>
        <div id="actionList" class="action-list"></div>
      </aside>

      <div class="stage-column">
        <div class="panel stage-panel">
          <canvas id="stage" width="960" height="540" aria-label="火柴人动画场景"></canvas>
          <div class="stage-hud" aria-hidden="true">
            <div class="hud-chip">动作 <strong id="hudAction">待机</strong></div>
            <div class="hud-chip">命中 <strong id="hitCount">0</strong></div>
          </div>
        </div>

        <section class="panel controls-panel" aria-label="播放控制">
          <div class="control-group play-group">
            <span class="control-label">播放</span>
            <button id="playPause" class="primary-button" type="button">暂停</button>
          </div>

          <div class="control-group target-group">
            <label for="targetSelect">受击目标</label>
            <select id="targetSelect">
              <option value="sandbag">沙袋</option>
              <option value="crate">木箱</option>
              <option value="dummy">敌人假人</option>
            </select>
          </div>

          <div class="control-group speed-group">
            <label for="speedRange">播放速度</label>
            <div class="range-row">
              <input id="speedRange" type="range" min="0.25" max="2" value="1" step="0.05">
              <output id="speedValue" class="speed-value" for="speedRange">1.00×</output>
            </div>
          </div>

          <div class="control-group box-count-group">
            <label for="boxCountRange">路线木箱</label>
            <div class="range-row">
              <input id="boxCountRange" type="range" min="1" max="5" value="3" step="1">
              <output id="boxCountValue" class="speed-value" for="boxCountRange">3 个</output>
            </div>
          </div>

          <div class="control-group switch-group">
            <span class="control-label">循环</span>
            <label class="switch-row"><input id="loopToggle" type="checkbox" checked> 开启</label>
          </div>

          <div class="control-group reset-group">
            <span class="control-label">场景</span>
            <button id="resetScene" class="secondary-button" type="button">重置反馈</button>
          </div>

          <div class="timeline" aria-hidden="true"><div id="timelineFill" class="timeline-fill"></div></div>
        </section>
        <p class="footer-note">点击场景中的道具也可切换受击目标</p>
      </div>
    </section>
  </main>

  <div id="announcer" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></div>

  <script>
    (() => {
      "use strict";

      const TAU = Math.PI * 2;
      const WORLD = { width: 960, height: 540, ground: 430 };
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");

      const ui = {
        actionList: document.getElementById("actionList"),
        mobileActionSelect: document.getElementById("mobileActionSelect"),
        playPause: document.getElementById("playPause"),
        targetSelect: document.getElementById("targetSelect"),
        speedRange: document.getElementById("speedRange"),
        speedValue: document.getElementById("speedValue"),
        boxCountRange: document.getElementById("boxCountRange"),
        boxCountValue: document.getElementById("boxCountValue"),
        loopToggle: document.getElementById("loopToggle"),
        resetScene: document.getElementById("resetScene"),
        hudAction: document.getElementById("hudAction"),
        hitCount: document.getElementById("hitCount"),
        timelineFill: document.getElementById("timelineFill"),
        announcer: document.getElementById("announcer")
      };

      const basePose = {
        rootX: 0, rootY: 0, torso: 0, squash: 1,
        pelvisTilt: 0, spineBend: 0, chestBend: 0, headTilt: 0,
        shoulderSpan: 1, hipSpan: 1,
        leftUpperArm: 1.92, leftLowerArm: 1.58, leftHand: 1.34,
        rightUpperArm: 1.20, rightLowerArm: 1.52, rightHand: 1.18,
        leftUpperLeg: 1.94, leftLowerLeg: 1.57, leftFoot: 0.10,
        rightUpperLeg: 1.20, rightLowerLeg: 1.57, rightFoot: 0.10
      };

      const pose = (changes = {}) => ({ ...basePose, ...changes });
      const frame = (t, changes) => ({ t, pose: pose(changes) });

      const ACTIONS = {
        idle: {
          label: "待机", en: "IDLE", duration: 1.8,
          frames: [
            frame(0, { rootY: 0, pelvisTilt: -0.015, chestBend: 0.018, leftUpperArm: 1.88, rightUpperArm: 1.24 }),
            frame(0.5, { rootY: 1, torso: 0.018, pelvisTilt: 0.012, chestBend: -0.014, headTilt: 0.018, leftUpperArm: 1.94, rightUpperArm: 1.18 }),
            frame(1, { rootY: 0, pelvisTilt: -0.015, chestBend: 0.018, leftUpperArm: 1.88, rightUpperArm: 1.24 })
          ]
        },
        walk: {
          label: "行走", en: "WALK", duration: 1.05,
          frames: [
            frame(0, { rootY: 0, torso: 0.025, pelvisTilt: 0.025, chestBend: -0.018, leftUpperArm: 1.14, leftLowerArm: 1.31, leftHand: 1.30, rightUpperArm: 1.94, rightLowerArm: 1.82, rightHand: 1.78, leftUpperLeg: 1.98, leftLowerLeg: 1.54, leftFoot: 0.08, rightUpperLeg: 1.16, rightLowerLeg: 1.52, rightFoot: 0.06 }),
            frame(0.25, { rootY: -2, torso: 0.02, pelvisTilt: 0, chestBend: 0.012, leftUpperArm: 1.27, leftLowerArm: 1.22, leftHand: 1.20, rightUpperArm: 1.86, rightLowerArm: 1.92, rightHand: 1.90, leftUpperLeg: 1.16, leftLowerLeg: 1.88, leftFoot: 0.18, rightUpperLeg: 1.55, rightLowerLeg: 1.57, rightFoot: 0.04 }),
            frame(0.5, { rootY: 0, torso: 0.025, pelvisTilt: -0.025, chestBend: -0.018, leftUpperArm: 1.94, leftLowerArm: 1.82, leftHand: 1.78, rightUpperArm: 1.14, rightLowerArm: 1.31, rightHand: 1.30, leftUpperLeg: 1.16, leftLowerLeg: 1.52, leftFoot: 0.06, rightUpperLeg: 1.98, rightLowerLeg: 1.54, rightFoot: 0.08 }),
            frame(0.75, { rootY: -2, torso: 0.02, pelvisTilt: 0, chestBend: 0.012, leftUpperArm: 1.86, leftLowerArm: 1.92, leftHand: 1.90, rightUpperArm: 1.27, rightLowerArm: 1.22, rightHand: 1.20, leftUpperLeg: 1.55, leftLowerLeg: 1.57, leftFoot: 0.04, rightUpperLeg: 1.16, rightLowerLeg: 1.88, rightFoot: 0.18 }),
            frame(1, { rootY: 0, torso: 0.025, pelvisTilt: 0.025, chestBend: -0.018, leftUpperArm: 1.14, leftLowerArm: 1.31, leftHand: 1.30, rightUpperArm: 1.94, rightLowerArm: 1.82, rightHand: 1.78, leftUpperLeg: 1.98, leftLowerLeg: 1.54, leftFoot: 0.08, rightUpperLeg: 1.16, rightLowerLeg: 1.52, rightFoot: 0.06 })
          ]
        },
        runStart: {
          label: "起跑", en: "START", duration: 1.45, loopable: false, landAt: 0.48, snappy: true,
          frames: [
            frame(0, { rootY: 2, torso: 0.06, leftUpperArm: 1.82, leftLowerArm: 1.58, rightUpperArm: 1.28, rightLowerArm: 1.55, leftUpperLeg: 1.98, rightUpperLeg: 1.14 }),
            frame(0.18, { rootX: -5, rootY: 14, torso: 0.24, squash: 0.92, pelvisTilt: -0.08, spineBend: 0.11, chestBend: 0.05, leftUpperArm: 2.02, leftLowerArm: 0.92, rightUpperArm: 1.02, rightLowerArm: -0.88, leftUpperLeg: 2.18, leftLowerLeg: 1.65, rightUpperLeg: 0.92, rightLowerLeg: 1.40 }),
            frame(0.34, { rootX: -8, rootY: 10, torso: 0.40, squash: 0.95, pelvisTilt: 0.08, spineBend: 0.06, chestBend: 0.02, leftUpperArm: 0.90, leftLowerArm: -0.88, rightUpperArm: 2.20, rightLowerArm: 0.76, leftUpperLeg: 2.20, leftLowerLeg: 1.55, rightUpperLeg: 0.54, rightLowerLeg: 2.02 }),
            frame(0.48, { rootX: 9, rootY: -7, torso: 0.38, pelvisTilt: -0.04, spineBend: 0.03, leftUpperArm: 2.18, leftLowerArm: 0.78, rightUpperArm: 0.88, rightLowerArm: -0.92, leftUpperLeg: 0.58, leftLowerLeg: 1.98, rightUpperLeg: 2.14, rightLowerLeg: 0.66 }),
            frame(0.68, { rootX: 22, rootY: 7, torso: 0.32, pelvisTilt: -0.05, leftUpperArm: 2.16, leftLowerArm: 0.80, rightUpperArm: 0.90, rightLowerArm: -0.88, leftUpperLeg: 0.98, leftLowerLeg: 1.50, rightUpperLeg: 2.12, rightLowerLeg: 1.55 }),
            frame(0.84, { rootX: 31, rootY: -9, torso: 0.28, pelvisTilt: 0.03, leftUpperArm: 0.92, leftLowerArm: -0.88, rightUpperArm: 2.16, rightLowerArm: 0.80, leftUpperLeg: 2.10, leftLowerLeg: 0.68, rightUpperLeg: 0.58, rightLowerLeg: 1.96 }),
            frame(1, { rootX: 38, rootY: 5, torso: 0.24, pelvisTilt: 0.04, leftUpperArm: 0.92, leftLowerArm: -0.88, rightUpperArm: 2.16, rightLowerArm: 0.80, leftUpperLeg: 2.12, leftLowerLeg: 1.52, rightUpperLeg: 1.00, rightLowerLeg: 1.48 })
          ]
        },
        accelerate: {
          label: "加速", en: "ACCEL", duration: 1.55, loopable: false, landAt: 0.42, snappy: true,
          frames: [
            frame(0, { rootY: 8, torso: 0.18, leftUpperArm: 0.96, leftLowerArm: -0.82, rightUpperArm: 2.10, rightLowerArm: 0.86, leftUpperLeg: 2.02, leftLowerLeg: 1.52, rightUpperLeg: 1.08, rightLowerLeg: 1.52 }),
            frame(0.20, { rootX: 5, rootY: -6, torso: 0.23, leftUpperArm: 2.12, leftLowerArm: 0.82, rightUpperArm: 0.92, rightLowerArm: -0.90, leftUpperLeg: 0.72, leftLowerLeg: 2.00, rightUpperLeg: 2.02, rightLowerLeg: 0.72 }),
            frame(0.42, { rootX: 15, rootY: 6, torso: 0.28, pelvisTilt: -0.04, leftUpperArm: 2.18, leftLowerArm: 0.76, rightUpperArm: 0.88, rightLowerArm: -0.94, leftUpperLeg: 1.02, leftLowerLeg: 1.48, rightUpperLeg: 2.16, rightLowerLeg: 1.52 }),

          ]
        },
        run: {
          label: "跑步", en: "RUN", duration: 0.82,
          frames: [
            // Contact: the forward foot reaches while the opposite arm leads.
            frame(0, { rootY: 4, torso: 0.36, pelvisTilt: 0.06, spineBend: 0.01, chestBend: -0.01, leftUpperArm: 0.92, leftLowerArm: -0.88, leftHand: -0.58, rightUpperArm: 2.18, rightLowerArm: 0.78, rightHand: 0.45, leftUpperLeg: 2.20, leftLowerLeg: 1.50, leftFoot: 0.10, rightUpperLeg: 1.00, rightLowerLeg: 1.48, rightFoot: 0.02 }),
            // Down: the stance knee absorbs weight; the rear heel lifts.
            frame(0.12, { rootY: 7, torso: 0.42, pelvisTilt: 0.03, spineBend: 0.02, chestBend: -0.01, leftUpperArm: 1.08, leftLowerArm: -0.90, leftHand: -0.62, rightUpperArm: 2.02, rightLowerArm: 0.84, rightHand: 0.52, leftUpperLeg: 2.08, leftLowerLeg: 1.58, leftFoot: 0.18, rightUpperLeg: 1.18, rightLowerLeg: 1.46, rightFoot: 0.04 }),
            // Passing: the free knee travels under the body, never folding across it.
            frame(0.25, { rootY: 0, torso: 0.40, pelvisTilt: 0, spineBend: 0.01, chestBend: 0.01, leftUpperArm: 1.64, leftLowerArm: 0.42, leftHand: 0.28, rightUpperArm: 1.48, rightLowerArm: -0.72, rightHand: -0.48, leftUpperLeg: 0.92, leftLowerLeg: 2.18, leftFoot: 0.24, rightUpperLeg: 1.50, rightLowerLeg: 1.56, rightFoot: 0.02 }),
            // Flight: both feet clear the floor and the arm swing changes sides.
            frame(0.38, { rootY: -8, torso: 0.38, pelvisTilt: -0.04, spineBend: 0, chestBend: 0.01, leftUpperArm: 2.18, leftLowerArm: 0.78, leftHand: 0.45, rightUpperArm: 0.92, rightLowerArm: -0.88, rightHand: -0.58, leftUpperLeg: 0.55, leftLowerLeg: 1.96, leftFoot: 0.24, rightUpperLeg: 2.12, rightLowerLeg: 0.68, rightFoot: 0.18 }),

        const dy = ankle.y - hip.y;
        const rawDistance = Math.hypot(dx, dy) || 0.001;
        const distance = clamp(rawDistance, Math.abs(upperLength - lowerLength) + 0.001, upperLength + lowerLength - 0.001);
        const ux = dx / rawDistance;
        const uy = dy / rawDistance;
        const along = (upperLength * upperLength - lowerLength * lowerLength + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upperLength * upperLength - along * along));
        const base = { x: hip.x + ux * along, y: hip.y + uy * along };

        // In side view both knees hinge toward the facing direction; they never fan left/right.
        return {
          x: base.x + uy * bend * facing,
          y: base.y - ux * bend * facing
        };
      }

      function worldToCanvasEvent(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * WORLD.width / rect.width,
          y: (event.clientY - rect.top) * WORLD.height / rect.height
        };
      }

      function setAction(id, announce = true) {
        if (!ACTIONS[id]) return;
        if (ACTIONS[id].target) {
          setActiveTarget(ACTIONS[id].target, false);
          const target = targetData.find((item) => item.id === ACTIONS[id].target);
          if (target) {
            target.x = 465;
            target.vx = 0;
            target.recoil = 0;
            target.shake = 0;
          }
        }
        state.action = id;
        state.elapsed = 0;
        state.playing = true;
        state.eventFlags = {};
        ui.mobileActionSelect.value = id;
        ui.hudAction.textContent = ACTIONS[id].label;
        ui.actionList.querySelectorAll("button").forEach((button) => {
          button.classList.toggle("active", button.dataset.action === id);
          button.setAttribute("aria-pressed", button.dataset.action === id ? "true" : "false");
        });
        updatePlayLabel();
        if (announce) ui.announcer.textContent = `已切换到${ACTIONS[id].label}动作`;
      }

      function updatePlayLabel() {
        ui.playPause.textContent = state.playing ? "暂停" : "播放";
      }

      function setActiveTarget(id, announce = true) {
        if (!targetData.some((item) => item.id === id)) return;
        state.activeTarget = id;
        ui.targetSelect.value = id;
        if (announce) {
          const target = targetData.find((item) => item.id === id);
          ui.announcer.textContent = `已选择${target.label}作为受击目标`;
        }
      }

      function buildActionControls() {
        ACTION_ORDER.forEach((id, index) => {
          const action = ACTIONS[id];
          const button = document.createElement("button");
          button.type = "button";
          button.className = "action-button";
          button.dataset.action = id;
          button.setAttribute("aria-pressed", "false");
          button.innerHTML = `<span class="index">${String(index + 1).padStart(2, "0")}</span><span>${action.label}</span><span class="en">${action.en}</span>`;
          button.addEventListener("click", () => setAction(id));
          ui.actionList.appendChild(button);

          const option = document.createElement("option");
          option.value = id;
          option.textContent = `${action.label} · ${action.en}`;
          ui.mobileActionSelect.appendChild(option);
        });
      }

      function resetFeedback() {
        targetData.forEach((target) => {
          target.x = target.homeX;
          target.vx = 0;
          target.flash = 0;
          target.shake = 0;
          target.recoil = 0;
        });
        state.particles.length = 0;
        state.rings.length = 0;
        state.hitCount = 0;
        state.heroFlash = 0;
        state.screenShake = 0;
        ui.hitCount.textContent = "0";
        ui.announcer.textContent = "场景反馈已重置";
      }

      function spawnBurst(x, y, force, color = "#f5b842") {
        const count = force > 1 ? 18 : 12;
        for (let i = 0; i < count; i += 1) {
          const angle = (-0.75 + Math.random() * 1.5) + (Math.random() > 0.65 ? Math.PI : 0);
          const speed = (75 + Math.random() * 145) * force;
          state.particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.35 + Math.random() * 0.28,
            maxLife: 0.63,
            size: 2 + Math.random() * 4,
            color
          });
        }
        state.rings.push({ x, y, radius: 8, life: 0.34, maxLife: 0.34, color });
      }

      function spawnDust(x, intensity = 1) {
        for (let i = 0; i < Math.round(15 * intensity); i += 1) {
          const direction = Math.random() > 0.5 ? 1 : -1;
          state.particles.push({
            x: x + (Math.random() - 0.5) * 34,
            y: WORLD.ground - 3,
            vx: direction * (25 + Math.random() * 95),
            vy: -(22 + Math.random() * 70),
            life: 0.4 + Math.random() * 0.35,
            maxLife: 0.75,
            size: 3 + Math.random() * 7,
            color: "#a99473"
          });
        }
        state.rings.push({ x, y: WORLD.ground - 2, radius: 12, life: 0.42, maxLife: 0.42, color: "#967e5d", flat: true });
      }

      function strikeTarget(kind) {
        const target = targetData.find((item) => item.id === state.activeTarget);
        if (!target) return;
        const power = kind === "kick" ? 1.28 : 1;
        const impactY = kind === "kick" ? WORLD.ground - 76 : WORLD.ground - 142;
        target.flash = 1;
        target.shake = 16 * power;
        target.vx += 118 * power;
        target.recoil = 1;
        state.screenShake = 4.5 * power;
        state.hitCount += 1;
        ui.hitCount.textContent = String(state.hitCount);
        spawnBurst(target.x - 24, impactY, power, kind === "kick" ? "#ef784f" : "#f3b63f");
        ui.announcer.textContent = `${ACTIONS[state.action].label}命中${target.label}`;
      }

      function heroHit() {
        state.heroFlash = 1;
        state.screenShake = Math.max(state.screenShake, 5);
        spawnBurst(315, WORLD.ground - 160, 0.85, "#ef5f55");
      }

      function fireActionEvents(progress) {
        const action = ACTIONS[state.action];
        if (action.strikeAt != null && progress >= action.strikeAt && !state.eventFlags.strike) {
          state.eventFlags.strike = true;
          strikeTarget(state.action);
        }
        if (action.landAt != null && progress >= action.landAt && !state.eventFlags.land) {
          state.eventFlags.land = true;
          const crate = targetData.find((target) => target.id === "crate");
          const routeLayout = getBoxRouteLayout();
          const landX = state.action === "knockdown" ? 260
            : state.action === "climbDown" ? (crate ? crate.x : 465) + 139
              : state.action === "boxRoute" ? routeLayout.lastCenter + 139
                : 330;
          const landForce = state.action === "knockdown" ? 1.15
            : state.action === "jump" ? 1.0
              : ["climbDown", "boxRoute"].includes(state.action) ? 0.55
                : 0.85;
          spawnDust(landX, landForce);
          state.screenShake = Math.max(state.screenShake, state.action === "knockdown" ? 5.5 : state.action === "jump" ? 3.8 : 2.8);
        }
        if (action.heroHitAt != null && progress >= action.heroHitAt && !state.eventFlags.heroHit) {
          state.eventFlags.heroHit = true;
          heroHit();
        }
      }

      function updateTargets(dt) {
        const selectedIndex = targetData.findIndex((item) => item.id === state.activeTarget);
        targetData.forEach((target, index) => {
          const slot = index === selectedIndex ? 465 : 680 + (index > selectedIndex ? index - 1 : index) * 145;
          const desired = Math.min(865, slot);
          target.vx += (desired - target.x) * 8 * dt;
          target.vx *= Math.pow(0.05, dt);
          target.x += target.vx * dt;
          target.flash = Math.max(0, target.flash - dt * 5.5);
          target.shake = Math.max(0, target.shake - dt * 44);
          target.recoil = Math.max(0, target.recoil - dt * 3.2);
        });
      }

      function updateEffects(dt) {
        state.heroFlash = Math.max(0, state.heroFlash - dt * 4.8);
        state.screenShake = Math.max(0, state.screenShake - dt * 15);

        state.particles.forEach((particle) => {
          particle.life -= dt;
          particle.vy += 250 * dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vx *= Math.pow(0.2, dt);
        });
        state.particles = state.particles.filter((particle) => particle.life > 0);

        state.rings.forEach((ring) => {
          ring.life -= dt;
          ring.radius += 130 * dt;
        });
        state.rings = state.rings.filter((ring) => ring.life > 0);
      }

      function update(dt) {
        if (state.playing) {
          const action = ACTIONS[state.action];
          state.elapsed += dt * state.speed;
          if (state.elapsed >= action.duration) {
            if (state.loop && action.loopable !== false) {
              state.elapsed %= action.duration;
              state.eventFlags = {};
            } else {
              state.elapsed = action.duration;
              state.playing = false;
              updatePlayLabel();
            }
          }
          fireActionEvents(clamp(state.elapsed / action.duration, 0, 1));
        }
        updateTargets(dt);
        updateEffects(dt);
      }

      function line(a, b, width, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, WORLD.ground);
        sky.addColorStop(0, "#c8dfe9");
        sky.addColorStop(0.7, "#e9edf0");
        sky.addColorStop(1, "#f5eee1");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WORLD.width, WORLD.ground);

        ctx.fillStyle = "rgba(61, 93, 106, 0.10)";
        ctx.beginPath();
        ctx.moveTo(0, 327);
        ctx.quadraticCurveTo(150, 286, 280, 331);
        ctx.quadraticCurveTo(420, 276, 574, 325);
        ctx.quadraticCurveTo(745, 270, 960, 318);
        ctx.lineTo(960, WORLD.ground);
        ctx.lineTo(0, WORLD.ground);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(55, 76, 84, 0.09)";
        ctx.lineWidth = 1;
        for (let x = 40; x < WORLD.width; x += 80) {
          ctx.beginPath();
          ctx.moveTo(x, 355);
          ctx.lineTo(x, WORLD.ground);
          ctx.stroke();
        }

        const ground = ctx.createLinearGradient(0, WORLD.ground, 0, WORLD.height);
        ground.addColorStop(0, "#9a845f");
        ground.addColorStop(0.06, "#756344");
        ground.addColorStop(0.07, "#c8ad79");
        ground.addColorStop(1, "#a98b59");
        ctx.fillStyle = ground;
        ctx.fillRect(0, WORLD.ground, WORLD.width, WORLD.height - WORLD.ground);

        ctx.strokeStyle = "rgba(92, 69, 39, 0.24)";
        for (let y = WORLD.ground + 26; y < WORLD.height; y += 27) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WORLD.width, y);
          ctx.stroke();
        }
      }

      function drawShadow(x, width, opacity = 0.2) {
        const gradient = ctx.createRadialGradient(x, WORLD.ground + 3, 2, x, WORLD.ground + 3, width);
        gradient.addColorStop(0, `rgba(24, 25, 23, ${opacity})`);
        gradient.addColorStop(1, "rgba(24, 25, 23, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(x, WORLD.ground + 3, width, 9, 0, 0, TAU);
        ctx.fill();
      }

      function targetOffset(target) {
        const shake = target.shake > 0 ? (Math.random() - 0.5) * target.shake : 0;
        return { x: target.x + shake, lean: target.recoil * 0.10 };
      }

      function targetColor(target, normal) {
        return target.flash > 0.3 ? "#ffffff" : normal;
      }

      function drawSandbag(target, selected) {
        const offset = targetOffset(target);
        const x = offset.x;
        drawShadow(x, 42, selected ? 0.26 : 0.16);
        ctx.save();
        ctx.translate(x, WORLD.ground - 195);
        ctx.rotate(offset.lean);
        ctx.strokeStyle = "#303238";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, -60);
        ctx.lineTo(0, -30);
        ctx.stroke();
        ctx.fillStyle = targetColor(target, "#7e4932");
        ctx.strokeStyle = "#422b22";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.roundRect(-31, -32, 62, 172, 26);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = targetColor(target, "#d5ad68");
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-25, 2);
        ctx.lineTo(25, 2);
        ctx.moveTo(-27, 95);
        ctx.lineTo(27, 95);
        ctx.stroke();
        ctx.restore();
        drawTargetLabel(target, x, selected);
      }

      function drawCrate(target, selected) {
        const offset = targetOffset(target);
        const x = offset.x;
        drawShadow(x, 45, selected ? 0.26 : 0.16);
        ctx.save();
        ctx.translate(x, WORLD.ground - 43);
        ctx.rotate(offset.lean * 0.55);
        ctx.fillStyle = targetColor(target, "#b9773e");
        ctx.strokeStyle = "#654225";
        ctx.lineWidth = 4;
        ctx.fillRect(-42, -43, 84, 84);
        ctx.strokeRect(-42, -43, 84, 84);
        ctx.strokeStyle = targetColor(target, "#7f522d");
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(-36, -35);
        ctx.lineTo(36, 35);
        ctx.moveTo(36, -35);
        ctx.lineTo(-36, 35);
        ctx.stroke();
        ctx.restore();
        drawTargetLabel(target, x, selected);
      }

      function getBoxRouteLayout() {
        const width = 84;
        const left = 380;
        const count = clamp(Math.round(state.boxCount), 1, 5);
        return {
          width,
          left,
          count,
          right: left + width * count,
          firstCenter: left + width / 2,
          lastCenter: left + width * count - width / 2,
          top: WORLD.ground - 86
        };
      }

      function drawRouteCrates() {
        const layout = getBoxRouteLayout();
        for (let index = 0; index < layout.count; index += 1) {
          const x = layout.firstCenter + index * layout.width;
          drawShadow(x, 42, 0.16);
          ctx.save();
          ctx.translate(x, WORLD.ground - 43);
          ctx.fillStyle = index % 2 === 0 ? "#b9773e" : "#ad6c36";
          ctx.strokeStyle = "#654225";
          ctx.lineWidth = 4;
          ctx.fillRect(-42, -43, 84, 84);
          ctx.strokeRect(-42, -43, 84, 84);
          ctx.strokeStyle = "#7f522d";
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo(-36, -35);
          ctx.lineTo(36, 35);
          ctx.moveTo(36, -35);
          ctx.lineTo(-36, 35);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawDummy(target, selected) {
        const offset = targetOffset(target);
        const x = offset.x;
        drawShadow(x, 38, selected ? 0.26 : 0.16);
        ctx.save();
        ctx.translate(x, 0);
        ctx.rotate(offset.lean * 0.45);
        const color = targetColor(target, "#33383d");
        ctx.strokeStyle = color;
        ctx.fillStyle = targetColor(target, "#d8dde0");
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, WORLD.ground - 176, 22, 0, TAU);
        ctx.fill();
        ctx.stroke();
        line({ x: 0, y: WORLD.ground - 153 }, { x: 0, y: WORLD.ground - 76 }, 8, color);
        line({ x: 0, y: WORLD.ground - 133 }, { x: -36, y: WORLD.ground - 93 }, 7, color);
        line({ x: 0, y: WORLD.ground - 133 }, { x: 37, y: WORLD.ground - 96 }, 7, color);
        line({ x: 0, y: WORLD.ground - 76 }, { x: -28, y: WORLD.ground - 8 }, 8, color);
        line({ x: 0, y: WORLD.ground - 76 }, { x: 28, y: WORLD.ground - 8 }, 8, color);
        ctx.fillStyle = targetColor(target, "#d9574d");
        ctx.beginPath();
        ctx.arc(0, WORLD.ground - 176, 7, 0, TAU);
        ctx.fill();
        ctx.restore();
        drawTargetLabel(target, x, selected);
      }

      function drawTargetLabel(target, x, selected) {
        ctx.save();
        ctx.font = "700 13px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const width = ctx.measureText(target.label).width + 22;
        ctx.fillStyle = selected ? "#171a1e" : "rgba(255,255,255,0.76)";
        ctx.strokeStyle = selected ? "#171a1e" : "rgba(55,65,72,0.18)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(x - width / 2, WORLD.ground + 19, width, 28, 5);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = selected ? "#ffffff" : "#3e474d";
        ctx.fillText(target.label, x, WORLD.ground + 33);
        ctx.restore();
      }

      function drawTargets() {
        if (state.action === "boxRoute") {
          drawRouteCrates();
          return;
        }
        const ordered = [...targetData].sort((a, b) => b.x - a.x);
        ordered.forEach((target) => {
          const selected = target.id === state.activeTarget;
          if (target.id === "sandbag") drawSandbag(target, selected);
          if (target.id === "crate") drawCrate(target, selected);
          if (target.id === "dummy") drawDummy(target, selected);
        });
      }

      const CLIMB_CYCLE = [

      function interpolateRunCycle(progress) {
        let a = RUN_CYCLE[0];
        let b = RUN_CYCLE[RUN_CYCLE.length - 1];
        for (let i = 0; i < RUN_CYCLE.length - 1; i += 1) {
          if (progress >= RUN_CYCLE[i].t && progress <= RUN_CYCLE[i + 1].t) {
            a = RUN_CYCLE[i];
            b = RUN_CYCLE[i + 1];
            break;
          }
        }
        const amount = ease(clamp((progress - a.t) / Math.max(0.0001, b.t - a.t), 0, 1));
        const result = {};
        Object.keys(a).forEach((key) => { result[key] = key === "t" ? progress : lerp(a[key], b[key], amount); });
        return result;
      }

      function interpolateJumpCycle(progress) {
        let a = JUMP_CYCLE[0];
        let b = JUMP_CYCLE[JUMP_CYCLE.length - 1];
        for (let i = 0; i < JUMP_CYCLE.length - 1; i += 1) {
          if (progress >= JUMP_CYCLE[i].t && progress <= JUMP_CYCLE[i + 1].t) {
            a = JUMP_CYCLE[i];
            b = JUMP_CYCLE[i + 1];
            break;
          }
        }
        const raw = clamp((progress - a.t) / Math.max(0.0001, b.t - a.t), 0, 1);
        let amount;
        if (a.t >= 0.08 && a.t < 0.18) amount = raw * raw;
        else if (a.t >= 0.32 && a.t < 0.40) amount = raw * raw;
        else if (a.t >= 0.40 && a.t < 0.44) amount = Math.pow(raw, 0.62);
        else if (a.t >= 0.44 && a.t < 0.66) amount = 1 - Math.pow(1 - raw, 2);
        else if (a.t >= 0.66 && a.t < 0.82) amount = raw * raw;
        else if (a.t >= 0.82 && a.t < 0.90) amount = 1 - Math.pow(1 - raw, 2.4);
        else amount = ease(raw);
        const result = {};
        Object.keys(a).forEach((key) => { result[key] = key === "t" ? progress : lerp(a[key], b[key], amount); });
        return result;
      }

      function interpolateClimbCycle(progress) {
        let a = CLIMB_CYCLE[0];
        let b = CLIMB_CYCLE[CLIMB_CYCLE.length - 1];
        for (let i = 0; i < CLIMB_CYCLE.length - 1; i += 1) {
          if (progress >= CLIMB_CYCLE[i].t && progress <= CLIMB_CYCLE[i + 1].t) {
            a = CLIMB_CYCLE[i];
            b = CLIMB_CYCLE[i + 1];
            break;
          }
        }
        const raw = clamp((progress - a.t) / Math.max(0.0001, b.t - a.t), 0, 1);
        const amount = a.t >= 0.48 && a.t < 0.80
          ? 1 - Math.pow(1 - raw, 2)
          : ease(raw);
        const result = {};
        Object.keys(a).forEach((key) => { result[key] = key === "t" ? progress : lerp(a[key], b[key], amount); });
        return result;
      }

      function drawRunCycle(progress) {
        const p = interpolateRunCycle(progress);
        const hip = { x: 326, y: WORLD.ground - 104 + p.rootY };
        const local = (x, y) => ({ x: hip.x + x, y: hip.y + y });

        const chest = local(p.lean * 0.72, -55);

        const neck = local(p.lean + 3, -73);

        const bElbow = local(p.bEx, p.bEy);
        const bHand = local(p.bHx, p.bHy);
        const aKnee = local(p.aKx, p.aKy);
        const aAnkle = local(p.aAx, p.aAy);
        const aToe = local(p.aTx, p.aTy);
        const bKnee = local(p.bKx, p.bKy);
        const bAnkle = local(p.bAx, p.bAy);
        const bToe = local(p.bTx, p.bTy);

        drawShadow(hip.x + 5, 45, 0.23);
        ctx.strokeStyle = "rgba(31,35,38,0.12)";

          const shift = (progress * 58 + i * 17) % 24;
          ctx.beginPath();
          ctx.moveTo(hip.x - 48 - i * 22 - shift, hip.y - 18 + i * 10);
          ctx.lineTo(hip.x - 94 - i * 27 - shift, hip.y - 18 + i * 10);

        const heroColor = state.heroFlash > 0.22 ? "#d9413a" : "#121416";

        line(shoulder, aElbow, 6.5, rearColor);
        line(aElbow, aHand, 6.5, rearColor);
        line(hip, aKnee, 7, rearColor);
        line(aKnee, aAnkle, 7, rearColor);
        line(aAnkle, aToe, 7, rearColor);

        line(hip, lowerSpine, 8, heroColor);
        line(lowerSpine, chest, 8, heroColor);
        line(chest, shoulder, 7.5, heroColor);
        line(shoulder, neck, 7, heroColor);
        line(shoulder, bElbow, 7, heroColor);
        line(bElbow, bHand, 7, heroColor);
        line(hip, bKnee, 7.5, heroColor);
        line(bKnee, bAnkle, 7.5, heroColor);
        line(bAnkle, bToe, 7.5, heroColor);

        ctx.fillStyle = rearColor;
        ctx.beginPath();
        ctx.arc(aHand.x, aHand.y, 6.5, 0, TAU);
        ctx.fill();
        ctx.fillStyle = heroColor;
        ctx.beginPath();
        ctx.arc(bHand.x, bHand.y, 7, 0, TAU);

        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(head.x, head.y, 18, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = heroColor;
        ctx.beginPath();
        const gazeY = p.headLook || 0;
        ctx.arc(head.x + 7, head.y - 4 + gazeY * 0.45, 2.7, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 4;
        ctx.beginPath();

        ctx.fillStyle = rearColor;

        ctx.arc(bHand.x, bHand.y, 7, 0, TAU);

        ctx.fillStyle = state.heroFlash > 0.22 ? "#fff2f1" : "#f7f8f8";
        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(head.x, head.y, 18, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = heroColor;
        ctx.beginPath();
        const gazeY = p.headLook || 0;
        ctx.arc(head.x + 7, head.y - 4 + gazeY * 0.45, 2.7, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(head.x + 15, head.y - 3 + gazeY * 0.55);

      function drawClimbPose(p, crateX, direction, contactProgress) {
        const hip = { x: crateX + p.hipX * direction, y: WORLD.ground + p.hipY };
        const local = (x, y) => ({ x: hip.x + x * direction, y: hip.y + y });
        const lowerSpine = local(p.lean * 0.38, -30);
        const chest = local(p.lean * 0.72, -55);
        const shoulder = local(p.lean, -67);
        const aShoulder = local(p.lean - 2, -66);
        const bShoulder = local(p.lean + 2, -67);
        const neck = local(p.lean + 3, -73);
        const head = local(p.lean + 10, -99);
        const constrainEnd = (origin, target, maxLength) => {
          const dx = target.x - origin.x;
          const dy = target.y - origin.y;
          const distance = Math.hypot(dx, dy) || 0.001;
          if (distance <= maxLength) return target;
          return { x: origin.x + dx / distance * maxLength, y: origin.y + dy / distance * maxLength };
        };
        const fixedFoot = (ankle, target) => {
          const dx = target.x - ankle.x;
          const dy = target.y - ankle.y;
          const distance = Math.hypot(dx, dy) || 1;
          return { x: ankle.x + dx / distance * 15, y: ankle.y + dy / distance * 15 };
        };
        const aHand = constrainEnd(aShoulder, local(p.aHx, p.aHy), 76.5);
        const bHand = constrainEnd(bShoulder, local(p.bHx, p.bHy), 76.5);
        const aElbow = solveSideViewKnee(aShoulder, aHand, 40, 37, -direction);
        const bElbow = solveSideViewKnee(bShoulder, bHand, 40, 37, direction);
        const aAnkle = constrainEnd(hip, local(p.aAx, p.aAy), 104.5);
        const bAnkle = constrainEnd(hip, local(p.bAx, p.bAy), 104.5);
        const aKnee = solveSideViewKnee(hip, aAnkle, 53, 52, direction);
        const bKnee = solveSideViewKnee(hip, bAnkle, 53, 52, direction);
        const aToe = fixedFoot(aAnkle, local(p.aTx, p.aTy));
        const bToe = fixedFoot(bAnkle, local(p.bTx, p.bTy));

        if (contactProgress < 0.52) drawShadow(hip.x + 2 * direction, 38, 0.20);
        const heroColor = state.heroFlash > 0.22 ? "#d9413a" : "#121416";
        const rearColor = state.heroFlash > 0.22 ? heroColor : "#303438";

        line(aShoulder, aElbow, 6.5, rearColor);
        line(aElbow, aHand, 6.5, rearColor);
        line(hip, aKnee, 7, rearColor);
        line(aKnee, aAnkle, 7, rearColor);
        line(aAnkle, aToe, 7, rearColor);

        line(hip, lowerSpine, 8, heroColor);
        line(lowerSpine, chest, 8, heroColor);
        line(chest, shoulder, 7.5, heroColor);
        line(shoulder, neck, 7, heroColor);
        line(bShoulder, bElbow, 7, heroColor);
        line(bElbow, bHand, 7, heroColor);
        line(hip, bKnee, 7.5, heroColor);
        line(bKnee, bAnkle, 7.5, heroColor);
        line(bAnkle, bToe, 7.5, heroColor);

        ctx.fillStyle = rearColor;
        ctx.beginPath();
        ctx.arc(aHand.x, aHand.y, 5.5, 0, TAU);
        ctx.fill();
        ctx.fillStyle = heroColor;
        ctx.beginPath();
        ctx.arc(bHand.x, bHand.y, 5.8, 0, TAU);
        ctx.fill();

        ctx.fillStyle = state.heroFlash > 0.22 ? "#fff2f1" : "#f7f8f8";
        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(head.x, head.y, 18, 0, TAU);
        ctx.fill();
        ctx.stroke();
        const gazeY = p.headLook || 0;
        ctx.fillStyle = heroColor;
        ctx.beginPath();
        ctx.arc(head.x + 7 * direction, head.y - 4 + gazeY * 0.45, 2.7, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(head.x + 15 * direction, head.y - 3 + gazeY * 0.55);
        ctx.lineTo(head.x + 22 * direction, head.y + 1 + gazeY);
        ctx.lineTo(head.x + 15 * direction, head.y + 5 + gazeY * 0.55);
        ctx.stroke();
      }

      function drawClimbCycle(progress) {
        const crate = targetData.find((target) => target.id === "crate");
        const crateX = crate ? crate.x : 465;
        drawClimbPose(interpolateClimbCycle(progress), crateX, 1, progress);
      }

      function drawClimbDownCycle(progress) {
        const crate = targetData.find((target) => target.id === "crate");
        const crateX = crate ? crate.x : 465;
        const reversed = 1 - progress;
        drawClimbPose(interpolateClimbCycle(reversed), crateX, -1, reversed);
      }

      function drawBoxRouteCycle(progress) {
        const layout = getBoxRouteLayout();
        const climbEnd = 0.30;
        const walkEnd = 0.53;
        const runEnd = 0.72;
        const turnEnd = 0.78;
        const travel = layout.lastCenter - layout.firstCenter;
        const walkFinish = layout.firstCenter + travel * 0.42;

        if (progress < climbEnd) {
          const phase = ease(progress / climbEnd);
          drawClimbPose(interpolateClimbCycle(phase), layout.firstCenter, 1, phase);
          return;
        }

        if (progress < walkEnd) {
          const phase = (progress - climbEnd) / (walkEnd - climbEnd);
          const x = lerp(layout.firstCenter, walkFinish, ease(phase));
          const cycle = (phase * Math.max(1, state.boxCount * 0.75)) % 1;
          ctx.save();
          ctx.translate(x - 326, layout.top - WORLD.ground);
          drawStickman(interpolatePose(ACTIONS.walk, cycle), cycle);
          ctx.restore();
          return;
        }

        if (progress < runEnd) {
          const phase = (progress - walkEnd) / (runEnd - walkEnd);
          const x = lerp(walkFinish, layout.lastCenter, ease(phase));
          const cycle = (phase * Math.max(1.5, state.boxCount * 0.9)) % 1;
          ctx.save();
          ctx.translate(x - 326, layout.top - WORLD.ground);
          drawRunCycle(cycle);
          ctx.restore();
          return;
        }

        if (progress < turnEnd) {
          drawClimbPose(interpolateClimbCycle(1), layout.lastCenter, -1, 1);
          return;
        }

        const phase = ease((progress - turnEnd) / (1 - turnEnd));
        const reversed = 1 - phase;
        drawClimbPose(interpolateClimbCycle(reversed), layout.lastCenter, -1, reversed);
      }

      function drawStickman(currentPose, progress) {
        const baseX = 326 + currentPose.rootX;
        const pelvis = { x: baseX, y: WORLD.ground - 104 + currentPose.rootY };

        // Control points stay hidden; the final silhouette remains a simple stick figure.
        const forwardLocomotion = state.action === "run";
        const lowerLean = forwardLocomotion ? 0.92 : 0.42;
        const chestLean = forwardLocomotion ? 1.00 : 0.82;
        const headLean = forwardLocomotion ? 1.02 : 1.00;
        const lowerSpineAngle = -Math.PI / 2 + currentPose.torso * lowerLean + currentPose.spineBend;
        const chestAngle = -Math.PI / 2 + currentPose.torso * chestLean + currentPose.chestBend;
        const neckAngle = -Math.PI / 2 + currentPose.torso * headLean + currentPose.chestBend * 0.28;
        const lowerSpine = pointFrom(pelvis, 24 * currentPose.squash, lowerSpineAngle);
        const chest = pointFrom(lowerSpine, 31 * currentPose.squash, chestAngle);
        const neck = pointFrom(chest, 15 * currentPose.squash, neckAngle);
        const head = pointFrom(neck, 27, -Math.PI / 2 + currentPose.torso * headLean + currentPose.headTilt);

        // Tiny front/back offsets prevent limb overlap without creating shoulder bars.
        const shoulderAxis = chestAngle + Math.PI / 2;
        const leftShoulder = pointFrom(chest, 2 * currentPose.shoulderSpan, shoulderAxis + Math.PI);
        const rightShoulder = pointFrom(chest, 2 * currentPose.shoulderSpan, shoulderAxis);
        const leftHip = pointFrom(pelvis, 1 * currentPose.hipSpan, currentPose.pelvisTilt + Math.PI);
        const rightHip = pointFrom(pelvis, 1 * currentPose.hipSpan, currentPose.pelvisTilt);

        const usesFists = ["run", "hardStop", "punch", "kick", "hit", "knockdown"].includes(state.action);
        const handReach = usesFists ? 4 : 11;
        const leftElbow = pointFrom(leftShoulder, 40, currentPose.leftUpperArm);
        const leftWrist = pointFrom(leftElbow, 37, currentPose.leftLowerArm);
        const leftHand = pointFrom(leftWrist, handReach, currentPose.leftHand);
        const rightElbow = pointFrom(rightShoulder, 41, currentPose.rightUpperArm);
        const rightWrist = pointFrom(rightElbow, 38, currentPose.rightLowerArm);
        const rightHand = pointFrom(rightWrist, handReach, currentPose.rightHand);

        let leftKnee = pointFrom(leftHip, 51, currentPose.leftUpperLeg);
        const leftAnkle = pointFrom(leftKnee, 49, currentPose.leftLowerLeg);
        let rightKnee = pointFrom(rightHip, 52, currentPose.rightUpperLeg);
        const rightAnkle = pointFrom(rightKnee, 49, currentPose.rightLowerLeg);
        const anatomicalLegs = ["runStart", "accelerate", "run", "hardStop", "slowStop", "punch", "kick"].includes(state.action);
        if (anatomicalLegs) {
          leftKnee = solveSideViewKnee(leftHip, leftAnkle, 51, 49, 1);
          rightKnee = solveSideViewKnee(rightHip, rightAnkle, 52, 49, 1);
        }
        const leftToe = pointFrom(leftAnkle, 13, currentPose.leftFoot);
        const rightToe = pointFrom(rightAnkle, 14, currentPose.rightFoot);

        const jumpHeight = Math.max(0, -currentPose.rootY);
        drawShadow(baseX + 4, clamp(46 - jumpHeight * 0.16, 24, 48), clamp(0.25 - jumpHeight * 0.0012, 0.10, 0.25));

        if (["runStart", "accelerate", "run"].includes(state.action)) {
          ctx.strokeStyle = "rgba(31,35,38,0.10)";
          ctx.lineWidth = 6;
          for (let i = 1; i <= 3; i += 1) {
            ctx.beginPath();
            ctx.moveTo(pelvis.x - 24 - i * 17, pelvis.y - 16 + i * 7);
            ctx.lineTo(pelvis.x - 72 - i * 20, pelvis.y - 16 + i * 7);
            ctx.stroke();
          }
        }

        const heroColor = state.heroFlash > 0.22 ? "#d9413a" : "#121416";
        const rearColor = state.heroFlash > 0.22 ? heroColor : "#303438";

        // A clean pose-to-pose silhouette: no visible rig nodes or shoulder/hip bars.
        line(leftShoulder, leftElbow, 6.5, rearColor);
        line(leftElbow, leftWrist, 6.5, rearColor);
        line(leftWrist, leftHand, 6, rearColor);
        line(leftHip, leftKnee, 7, rearColor);
        line(leftKnee, leftAnkle, 7, rearColor);
        line(leftAnkle, leftToe, 7, rearColor);

        line(pelvis, lowerSpine, 8, heroColor);
        line(lowerSpine, chest, 8, heroColor);
        line(chest, neck, 7, heroColor);

        line(rightShoulder, rightElbow, 7, heroColor);
        line(rightElbow, rightWrist, 7, heroColor);
        line(rightWrist, rightHand, 6.5, heroColor);
        line(rightHip, rightKnee, 7.5, heroColor);
        line(rightKnee, rightAnkle, 7.5, heroColor);
        line(rightAnkle, rightToe, 7.5, heroColor);

        if (usesFists) {
          ctx.fillStyle = rearColor;
          ctx.beginPath();
          ctx.arc(leftHand.x, leftHand.y, 6.5, 0, TAU);
          ctx.fill();
          ctx.fillStyle = heroColor;
          ctx.beginPath();
          ctx.arc(rightHand.x, rightHand.y, 7, 0, TAU);
          ctx.fill();
        }

        ctx.fillStyle = state.heroFlash > 0.22 ? "#fff2f1" : "#f7f8f8";
        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(head.x, head.y, 18, 0, TAU);
        ctx.fill();
        ctx.stroke();

        // Profile cue: the eye and nose establish a consistent right-facing body direction.
        ctx.fillStyle = heroColor;
        ctx.beginPath();
        ctx.arc(head.x + 7, head.y - 4, 2.7, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = heroColor;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(head.x + 15, head.y - 3);
        ctx.lineTo(head.x + 22, head.y + 1);
        ctx.lineTo(head.x + 15, head.y + 5);
        ctx.stroke();

        if (state.action === "victory" && progress > 0.34) {
          const alpha = 0.45 + Math.sin(progress * TAU * 4) * 0.18;
          ctx.fillStyle = `rgba(239, 159, 60, ${alpha})`;
          [[head.x - 48, head.y - 42], [head.x + 52, head.y - 34], [head.x, head.y - 62]].forEach(([x, y], index) => {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(progress * TAU + index);
            ctx.fillRect(-2, -9, 4, 18);
            ctx.fillRect(-9, -2, 18, 4);
            ctx.restore();
          });
        }
      }

      function drawEffects() {
        state.rings.forEach((ring) => {
          const alpha = clamp(ring.life / ring.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = ring.color;
          ctx.lineWidth = 4 * alpha + 1;
          ctx.beginPath();
          if (ring.flat) ctx.ellipse(ring.x, ring.y, ring.radius * 1.7, ring.radius * 0.28, 0, 0, TAU);
          else ctx.arc(ring.x, ring.y, ring.radius, 0, TAU);
          ctx.stroke();
          ctx.restore();
        });

        state.particles.forEach((particle) => {
          const alpha = clamp(particle.life / particle.maxLife, 0, 1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = particle.color;
          ctx.translate(particle.x, particle.y);
          ctx.rotate(Math.atan2(particle.vy, particle.vx));
          ctx.fillRect(-particle.size * 1.5, -particle.size / 2, particle.size * 3, particle.size);
          ctx.restore();
        });
      }

      function draw() {
        const scaleX = canvas.width / WORLD.width;
        const scaleY = canvas.height / WORLD.height;
        ctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);
        ctx.clearRect(0, 0, WORLD.width, WORLD.height);

        const shakeX = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
        const shakeY = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake * 0.6 : 0;
        ctx.save();
        ctx.translate(shakeX, shakeY);
        drawBackground();
        drawTargets();
        const action = ACTIONS[state.action];
        const progress = clamp(state.elapsed / action.duration, 0, 1);
        if (state.action === "run") drawRunCycle(progress);
        else if (state.action === "jump") drawJumpCycle(progress);
        else if (state.action === "climb") drawClimbCycle(progress);
        else if (state.action === "climbDown") drawClimbDownCycle(progress);
        else if (state.action === "boxRoute") drawBoxRouteCycle(progress);
        else drawStickman(interpolatePose(action, progress), progress);
        drawEffects();
        ctx.restore();

        ui.timelineFill.style.transform = `scaleX(${progress})`;
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(320, Math.round(rect.width * dpr));
        const height = Math.round(width * 9 / 16);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      function tick(now) {
        const dt = Math.min(0.034, Math.max(0, (now - state.lastTime) / 1000));
        state.lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(tick);
      }

      buildActionControls();
      setAction("idle", false);
      setActiveTarget("sandbag", false);
      resizeCanvas();

      ui.mobileActionSelect.addEventListener("change", (event) => setAction(event.target.value));
      ui.targetSelect.addEventListener("change", (event) => setActiveTarget(event.target.value));
      ui.playPause.addEventListener("click", () => {
        const action = ACTIONS[state.action];
        if (!state.playing && state.elapsed >= action.duration) {
          state.elapsed = 0;
          state.eventFlags = {};
        }
        state.playing = !state.playing;
        updatePlayLabel();
        ui.announcer.textContent = state.playing ? "动画继续播放" : "动画已暂停";
      });
      ui.speedRange.addEventListener("input", (event) => {
        state.speed = Number(event.target.value);
        ui.speedValue.value = `${state.speed.toFixed(2)}×`;
      });
      ui.boxCountRange.addEventListener("input", (event) => {
        state.boxCount = clamp(Number(event.target.value), 1, 5);
        ui.boxCountValue.value = `${state.boxCount} 个`;
        if (state.action === "boxRoute") {
          state.elapsed = 0;
          state.playing = true;
          state.eventFlags = {};
          updatePlayLabel();
        }
        ui.announcer.textContent = `箱顶路线已设置为${state.boxCount}个木箱`;
      });
      ui.loopToggle.addEventListener("change", (event) => {
        state.loop = event.target.checked;
        ui.announcer.textContent = state.loop ? "已开启循环播放" : "已关闭循环播放";
      });
      ui.resetScene.addEventListener("click", resetFeedback);

      canvas.addEventListener("click", (event) => {
        const point = worldToCanvasEvent(event);
        const target = targetData
          .map((item) => ({ item, distance: Math.abs(point.x - item.x) }))
          .filter(({ distance }) => distance < 72)
          .sort((a, b) => a.distance - b.distance)[0];
        if (target && point.y > 180) setActiveTarget(target.item.id);
      });

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("keydown", (event) => {
        if (event.target.matches("input, select, button")) return;
        if (event.code === "Space") {
          event.preventDefault();
          ui.playPause.click();
          return;
        }
        const index = Number(event.key) - 1;
        const ids = ACTION_ORDER;
        if (index >= 0 && index < ids.length) setAction(ids[index]);
      });

      requestAnimationFrame((now) => {
        state.lastTime = now;
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
